name: Build Android APK

# Roda toda vez que você enviar código para o branch "main", ou quando
# você clicar manualmente em "Run workflow" na aba Actions do GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java (necessário para compilar Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar o Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências do projeto
        run: npm install

      - name: Sincronizar o Capacitor com a pasta android/
        run: npx cap sync android

      - name: Dar permissão de execução ao gradlew
        run: chmod +x ./android/gradlew

      - name: Compilar o APK (modo debug, para testes)
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: chegoja-entregas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
