name: Build Android APK

# Agora o .apk só é gerado quando muda algo DENTRO do app (código Android, plugins,
# configuração) ou quando você clicar manualmente em "Run workflow" na aba Actions.
# Mudanças só na tela (pasta www) vão pelo outro fluxo, "Atualização ao vivo da tela",
# e chegam no celular sem .apk novo.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java (necessário para compilar Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # O runner do GitHub já vem com o Android SDK pré-instalado e as
      # licenças já aceitas, então não precisamos de um passo separado
      # para baixar/configurar o SDK (isso evita a trava que tínhamos
      # antes com a action android-actions/setup-android).

      - name: Instalar dependências do projeto
        run: npm install

      - name: Sincronizar o Capacitor com a pasta android/
        run: npx cap sync android

      - name: Dar permissão de execução ao gradlew
        run: chmod +x ./android/gradlew

      # Sem isto, cada build sairia assinado com uma chave nova e diferente,
      # e o Android não deixaria o app atualizar por cima do anterior
      # (era preciso desinstalar). Com a chave fixa guardada no GitHub
      # (Settings > Secrets and variables > Actions > DEBUG_KEYSTORE_BASE64),
      # todo APK sai com a mesma assinatura.
      - name: Usar a chave de assinatura fixa
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "ERRO: o secret DEBUG_KEYSTORE_BASE64 ainda não foi criado no GitHub."
            echo "Veja: Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Compilar o APK (modo debug, para testes)
        run: cd android && ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      # Só informativo: mostra a "impressão digital" da assinatura do APK.
      # Ela deve ser IGUAL em todos os builds; se mudar, o app não atualiza por cima.
      - name: Mostrar a assinatura do APK
        continue-on-error: true
        run: |
          APKSIGNER=$(ls -d /usr/local/lib/android/sdk/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"

      - name: Disponibilizar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: chegoja-entregas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
