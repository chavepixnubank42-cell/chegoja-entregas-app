name: Gerar chave de assinatura

on:
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Criar a chave
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          base64 -w 0 debug.keystore > chave-base64.txt

      - name: Guardar o texto da chave (1 dia)
        uses: actions/upload-artifact@v4
        with:
          name: chave-base64
          path: chave-base64.txt
          retention-days: 1
